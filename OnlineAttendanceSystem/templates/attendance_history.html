{% extends 'base.html' %}{% block content %}<div class="title"><div><span class="eyebrow">RECORDS</span><h1>Attendance History</h1></div></div><div class="card table"><table><tr><th>Date</th><th>Student</th><th>Department</th><th>Status</th></tr>{% for r in records %}<tr><td>{{r.date}}</td><td>{{r.name}}</td><td>{{r.department}}</td><td class="{{'green' if r.status=='Present' else 'red'}}">{{r.status}}</td></tr>{% else %}<tr><td colspan="4">No records.</td></tr>{% endfor %}</table></div>{% endblock %}
