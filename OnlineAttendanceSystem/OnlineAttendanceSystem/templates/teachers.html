{% extends 'base.html' %}{% block content %}<div class="title"><div><span class="eyebrow">TEACHER MANAGEMENT</span><h1>Teachers</h1></div><a class="btn" href="{{url_for('add_teacher')}}">+ Add Teacher</a></div><div class="card table"><table><tr><th>Name</th><th>Email</th><th>Subject</th><th>Actions</th></tr>{% for t in teachers %}<tr><td><b>{{t.name}}</b></td><td>{{t.email}}</td><td>{{t.subject}}</td><td><a href="{{url_for('edit_teacher',id=t.id)}}">Edit</a> · <form class="inline" method="post" action="{{url_for('delete_teacher',id=t.id)}}"><button class="link red">Delete</button></form></td></tr>{% else %}<tr><td colspan="4">No teachers yet.</td></tr>{% endfor %}</table></div>{% endblock %}
