{% extends 'base.html' %}{% block content %}<div class="title"><div><span class="eyebrow">DAILY ATTENDANCE</span><h1>Mark Attendance</h1></div><a href="{{url_for('history')}}">View History</a></div><div class="card"><form method="post"><label>Date</label><input type="date" name="date" value="{{date}}" required><div class="attendance">{% for s in students %}<div><b>{{s.name}}</b><span>{{s.department}}</span><label><input type="radio" name="status_{{s.id}}" value="Present" {% if old.get(s.id)=='Present' %}checked{% endif %}> Present</label><label><input type="radio" name="status_{{s.id}}" value="Absent" {% if old.get(s.id)=='Absent' %}checked{% endif %}> Absent</label></div>{% else %}<p>Add students first.</p>{% endfor %}</div>{% if students %}<button class="btn">Save Attendance</button>{% endif %}</form></div>{% endblock %}
