<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}AttendEase{% endblock %}</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body>{% if session.get('logged_in') %}<nav><a class="logo" href="{{url_for('dashboard')}}">✓ AttendEase</a><div><a href="{{url_for('dashboard')}}">Dashboard</a><a href="{{url_for('students')}}">Students</a><a href="{{url_for('teachers')}}">Teachers</a><a href="{{url_for('attendance')}}">Attendance</a><a href="{{url_for('reports')}}">Reports</a><a href="{{url_for('about')}}">About</a><a href="{{url_for('logout')}}">Logout</a></div></nav>{% endif %}{% with m=get_flashed_messages(with_categories=true) %}{% for c,x in m %}<div class="flash {{c}}">{{x}}</div>{% endfor %}{% endwith %}<main>{% block content %}{% endblock %}</main><script src="{{url_for('static',filename='script.js')}}"></script></body></html>
